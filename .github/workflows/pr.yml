on:
  pull_request:

name: Run PR Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  SwiftLint:
    # Ubuntu instead of macOS: linting needs no Apple toolchain, and the official Linux
    # image below already ships the pinned SwiftLint binary.
    runs-on: ubuntu-latest
    # Pinned, so CI and a local run of the same image report the same violations:
    # `docker run --rm -v "$PWD":/work -w /work ghcr.io/realm/swiftlint:0.65.1 --strict`
    # (the image's entrypoint is already `swiftlint`). The image has neither git nor
    # curl; checkout falls back to the REST API to download the ref when git isn't on
    # PATH, which is all this job needs since it lints the whole tree, not a diff.
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7

      # From the repo root, so .swiftlint.yml applies and .build checkouts stay excluded.
      # A container job's `run:` steps exec into the running container with `sh`, so the
      # image's `swiftlint` entrypoint plays no part here.
      - name: Lint
        run: swiftlint --strict

  # Resolves like Xcode Cloud: Renovate's own commit may go red when a bump changes the dependency
  # set, which is expected; the bot head that follows gets this run in approval-required state.
  BuildAndTest:
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Approve macros
        run: cd ci_scripts && bash ci_post_clone.sh

      - name: Build ArchiverLib
        run: xcodebuild -disableAutomaticPackageResolution -workspace PDFArchiver.xcworkspace -scheme ArchiverLib -destination 'platform=macOS' -configuration Debug build

      # The CI plan excludes the `ocr` tag: Vision text recognition never
      # finishes on the runner VM (no GPU/Neural Engine). Use the default
      # `ArchiverLib` plan locally to run those tests as well.
      - name: Test ArchiverLib
        timeout-minutes: 30
        run: xcodebuild test -disableAutomaticPackageResolution -workspace PDFArchiver.xcworkspace -scheme ArchiverLib -testPlan ArchiverLib-CI -destination 'platform=macOS' -configuration Debug
