on:
  pull_request:

name: Run PR Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: GitHub Action for SwiftLint (Only files changed in the PR)
        uses: stanfordbdhg/action-swiftlint@v4
        env:
          DIFF_BASE: ${{ github.base_ref }}

  BuildAndTest:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Approve macros
        run: cd ci_scripts && bash ci_post_clone.sh

      - name: Build ArchiverLib
        run: xcodebuild -workspace PDFArchiver.xcworkspace -scheme ArchiverLib -destination 'platform=macOS' -configuration Debug build

      - name: Test ArchiverLib
        run: xcodebuild test -workspace PDFArchiver.xcworkspace -scheme ArchiverLib -destination 'platform=macOS' -configuration Debug
