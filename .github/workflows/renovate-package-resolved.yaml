name: Update Package.resolved for Renovate

on:
  push:
    branches:
      - "renovate/**"

jobs:
  update-package-resolved:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Delete existing Package.resolved to force regeneration
        run: |
          rm -f ArchiverLib/Package.resolved

      - name: Resolve ArchiverLib SPM packages
        run: |
          cd ArchiverLib && swift package resolve

      - name: Sync Package.resolved to xcworkspace and xcodeproj
        run: |
          cp ArchiverLib/Package.resolved PDFArchiver.xcworkspace/xcshareddata/swiftpm/Package.resolved
          cp ArchiverLib/Package.resolved PDFArchiver.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Install LicensePlist
        run: |
          brew install licenseplist

      - name: Update Settings.bundle with licenses
        run: |
          license-plist --suppress-opening-directory --add-version-numbers --force --output-path Shared/Resources/Settings.bundle --package-paths ArchiverLib/Package.swift

      - name: Check for changes in Package.resolved and Settings.bundle
        id: changes
        run: |
          if git diff --quiet ArchiverLib/Package.resolved Shared/Resources/Settings.bundle/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit Package.resolved and Settings.bundle changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ArchiverLib/Package.resolved
          git add PDFArchiver.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git add PDFArchiver.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git add Shared/Resources/Settings.bundle/
          git commit -m "Package.resolved and Settings.bundle updated"
          git push
