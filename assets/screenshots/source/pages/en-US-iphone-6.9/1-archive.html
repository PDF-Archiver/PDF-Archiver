<!doctype html>
<!-- B5 · Webseite in Linien. One generic slot: each shot's CAPTION carries the markup of the
     site component that frame uses (filename rules, numbered step, chips, promises, legend),
     and frame.css styles all of them. So the frames differ without needing a template each. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="frame-size" content="1320x2868">
    <meta name="frame-out" content="en-US/iphone-6.9">
    <title>1-archive</title>
    <link rel="stylesheet" href="frame.css">
    <style>.figure{margin-top:5vh}.device{width:56vw;height:auto;max-height:none;margin-bottom:0}.fn{font-size:clamp(1.1vh,calc(150cqw / var(--fn-chars,52)),2.85vh);justify-content:center}.fn-part{align-items:stretch}.fn-label{font-size:calc(106cqw / var(--fn-chars,52))}</style>
</head>
<body class="layout-full">
    <h1 class="headline">An archive that outlasts the app</h1>
    <div class="figure"><div class="fn-card" style="--fn-chars: 45"><div class="fn"><span class="fn-part date"><span>2026-03-12</span><span class="fn-label">Date</span></span><span class="fn-sep">--</span><span class="fn-part desc"><span>electricity-bill</span><span class="fn-label">Description</span></span><span class="fn-sep">__</span><span class="fn-part tags"><span>energy_bill</span><span class="fn-label">Tags</span></span><span class="fn-ext">.pdf</span></div></div></div>
    <div class="stage">
        <div class="device">
            <div class="status-bar hidden"><span>9:41</span><span></span></div>
            <div class="screen"><img src="01-archive.png" alt=""></div>
        </div>
    </div>
</body>
</html>
