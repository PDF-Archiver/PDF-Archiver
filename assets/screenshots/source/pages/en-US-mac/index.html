<!doctype html>
<meta charset="utf-8">
<title>2880x1800 frames</title>
<style>
  body{margin:0;padding:24px;background:#1a1a1a;color:#eee;
       font:13px/1.4 -apple-system,sans-serif}
  .row{display:flex;gap:24px;overflow-x:auto;padding-bottom:16px}
  figure{margin:0;flex:0 0 auto}
  figcaption{padding-top:8px;text-align:center;opacity:.7}
  .thumb{width:720px;height:450px;overflow:hidden}
  iframe{width:2880px;height:1800px;border:0;transform:scale(.25);
         transform-origin:top left;display:block}
:root{--corner:calc(var(--device-width) * 0.0417);--screen-corner:calc(var(--device-width) * 0.0417)}.screen{overflow:hidden}</style>
<h2>2880 &times; 1800</h2>
<div class="row">
  <figure><div class="thumb"><iframe src="1-archive.html" title="1-archive"></iframe></div><figcaption>1-archive</figcaption></figure>
  <figure><div class="thumb"><iframe src="2-tag.html" title="2-tag"></iframe></div><figcaption>2-tag</figcaption></figure>
  <figure><div class="thumb"><iframe src="3-document.html" title="3-document"></iframe></div><figcaption>3-document</figcaption></figure>
  <figure><div class="thumb"><iframe src="4-keep.html" title="4-keep"></iframe></div><figcaption>4-keep</figcaption></figure>
  <figure><div class="thumb"><iframe src="5-privacy.html" title="5-privacy"></iframe></div><figcaption>5-privacy</figcaption></figure>
</div>
