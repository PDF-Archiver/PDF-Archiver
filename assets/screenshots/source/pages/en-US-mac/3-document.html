<!doctype html>
<!-- B5 · Webseite in Linien. One generic slot: each shot's CAPTION carries the markup of the
     site component that frame uses (filename rules, numbered step, chips, promises, legend),
     and frame.css styles all of them. So the frames differ without needing a template each. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="frame-size" content="2880x1800">
    <meta name="frame-out" content="en-US/mac">
    <title>3-document</title>
    <link rel="stylesheet" href="frame.css">
    <style>:root{--device-aspect:1440/900;--device-width:54vw;--frame-pad:5vw;--text-column:36%;--column-gap:5vw;--bezel:0;--corner:calc(var(--device-width) * 0.038);--screen-corner:0}.headline{font-size:9.56vh}.lead{font-size:4.4vh}.chips{gap:1.7vh;margin-top:3vh}.chips code{font-size:3.25vh}.fn-card{border-radius:2.8vh;padding:2.6vh 2.4vw}.legend-card{border-radius:3vh;padding:2vh 3vw 4vh}.legend-card b{font-size:5vh}.legend-card span{font-size:4.4vh}.promises{--promise-box:5vh;gap:4.6vh}.promises div{font-size:5.6vh}.promises i{font-size:3.8vh;border-radius:1.2vh}.layout-statement .figure{max-width:62vw}.device{background:none;box-shadow:0 2.4vh 5vh rgba(20,28,39,0.2)}.screen{background:transparent}:root{--corner:calc(var(--device-width) * 0.0417);--screen-corner:calc(var(--device-width) * 0.0417)}.screen{overflow:hidden}</style>
</head>
<body class="layout-full">
    <h1 class="headline">Search for a tag or the text inside the document</h1>
    <div class="figure"><p class="lead">The recognised text sits inside the PDF — in the archive, in Spotlight, in the Finder.</p></div>
    <div class="stage">
        <div class="device">
            <div class="status-bar hidden"><span>9:41</span><span></span></div>
            <div class="screen"><img src="03-document.png" alt=""></div>
        </div>
    </div>
</body>
</html>
