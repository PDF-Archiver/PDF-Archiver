<!doctype html>
<!-- B5 · Webseite in Linien. One generic slot: each shot's CAPTION carries the markup of the
     site component that frame uses (filename rules, numbered step, chips, promises, legend),
     and frame.css styles all of them. So the frames differ without needing a template each. -->
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="frame-size" content="2752x2064">
    <meta name="frame-out" content="de-DE/ipad-13">
    <title>2-scan</title>
    <link rel="stylesheet" href="frame.css">
    <style>:root{--device-aspect:2752/2064;--device-width:60vw;--frame-pad:5vw;--text-column:40%;--column-gap:3vw;--bezel:0.6vh;--corner:2vh;--screen-corner:1.4vh}.headline{font-size:8.34vh}.lead{font-size:3.6vh}.chips{gap:1.5vh;margin-top:2.8vh}.chips code{font-size:2.7vh}.legend-card{border-radius:2.8vh;padding:1.8vh 3vw 3.6vh}.legend-card b{font-size:4.1vh}.legend-card span{font-size:3.8vh}.symbols{gap:3vw}.symbols i{width:11vw;height:11vw;border-radius:2.6vh}.symbols figure{width:14vw}.symbols figcaption{font-size:3vh}.layout-statement .figure{max-width:68vw}.layout-symbols .lead{max-width:72vw}.layout-symbols .symbols{justify-content:flex-start;margin-top:6vh;gap:4vw}.layout-symbols .symbols figure{width:22vw}.layout-symbols .symbols i{width:18vw;height:18vw;border-radius:3.4vh}.layout-symbols .symbols figcaption{font-size:3.2vh}.layout-symbols .symbols{justify-content:center}.layout-symbols .symbols figure{width:16vw}.layout-symbols .symbols i{width:12vw;height:12vw}</style>
</head>

    <div class="figure"><p class="lead">Der Scan landet zugeschnitten und gerade im Eingang — ohne Server.</p><div class="symbols"><figure><i><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/><path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.2"/></svg></i><figcaption>Über die Seite halten</figcaption></figure><figure><i><svg viewBox="0 0 24 24"><path d="M7 3v14h14"/><path d="M3 7h14v14"/></svg></i><figcaption>Zugeschnitten und gerade</figcaption></figure><figure><i><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9h8"/><path d="M8 12.5h8"/><path d="M8 16h4.5"/></svg></i><figcaption>Text auf dem Gerät erkannt</figcaption></figure></div></div>

        <div class="device">

            <div class="screen"></div>
        </div>
    </div>

</html>
